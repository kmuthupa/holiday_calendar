<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSD 204 School Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="minimal-container">
        <header class="minimal-header">
            <h1 id="currentMonthYear">August 2026</h1>
            <div class="minimal-nav">
                <button id="goToToday" class="today-btn">Today</button>
                <button id="prevMonth" aria-label="Previous Month">←</button>
                <button id="nextMonth" aria-label="Next Month">→</button>
            </div>
        </header>

        <section id="countdownSection" class="minimal-countdown">
            <p id="nextBreakText">Loading next break…</p>
        </section>

        <div class="minimal-grid-container">
            <div class="minimal-grid">
                <div class="minimal-day-header">S</div>
                <div class="minimal-day-header">M</div>
                <div class="minimal-day-header">T</div>
                <div class="minimal-day-header">W</div>
                <div class="minimal-day-header">T</div>
                <div class="minimal-day-header">F</div>
                <div class="minimal-day-header">S</div>
                <div id="calendarDays" class="minimal-days-wrapper"></div>
            </div>
        </div>

        <footer class="minimal-footer">
            <button id="togglePlanningMode" class="minimal-btn">Planning Mode: Off</button>
        </footer>
    </main>

    <!-- Simple Event Modal -->
    <div class="modal hidden" id="eventModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <h2 id="modalDate"></h2>
            <div id="modalEvents"></div>
            <button id="modalClose" class="minimal-btn">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
